name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Uso il keystore fornito nei secrets del repository"
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Nessun keystore nei secrets: ne genero uno temporaneo"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass mwutils2024 -alias mwutils -keypass mwutils2024 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MW Utils, OU=MWUtils, O=MWUtils, C=IT"
            KEYSTORE_PASSWORD=mwutils2024
            KEY_ALIAS=mwutils
            KEY_PASSWORD=mwutils2024
          fi
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/mwutils-${{ github.ref_name }}.apk"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mwutils-*.apk
          generate_release_notes: true
