name: Android Build & Release

on:
  # Build automatica a OGNI push/merge su main:
  # l'APK è sempre disponibile come artifact della run;
  # se il commit è un tag v* viene inoltre creata la GitHub Release.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "suffix=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "suffix=v$VERSION-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Uso il keystore fornito nei secrets del repository"
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Nessun keystore nei secrets: ne genero uno temporaneo"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass mwutils2024 -alias mwutils -keypass mwutils2024 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MW Utils, OU=MWUtils, O=MWUtils, C=IT"
            KEYSTORE_PASSWORD=mwutils2024
            KEY_ALIAS=mwutils
            KEY_PASSWORD=mwutils2024
          fi
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/mwutils-${{ steps.version.outputs.suffix }}.apk"
          ls -la dist

      - name: Upload build artifact (ogni push)
        uses: actions/upload-artifact@v4
        with:
          name: mwutils-apk-${{ steps.version.outputs.suffix }}
          path: dist/mwutils-*.apk
          if-no-files-found: error

      - name: Delete previous rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish rolling release "Latest" (ogni push su main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MW Utils — ultima build (main)" \
            --notes "Build automatica dal commit $GITHUB_SHA.

          APK: mwutils-${{ steps.version.outputs.suffix }}.apk (versione ${{ steps.version.outputs.version }}).

          Questa release viene sostituita a ogni push su main: scarica sempre l'APK più recente da qui." \
            dist/mwutils-*.apk

      - name: Publish versioned release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mwutils-*.apk
          generate_release_notes: true

